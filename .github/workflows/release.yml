name: Release

# **只在手动 dispatch 时运行——`push: tags: ['v*']` 已移除（2026-09-18 决定）。**
#
# 本仓的发行流程是**本地构建 + 手动上传资产**：`bun run release:portable` 出 zip/sha256/
# manifest，再 `gh release create <tag> <assets>` 一并建 tag 与 release。既然资产在打 tag
# 之前就已上传，tag 推送再触发一次 CI 构建纯属重复：0.2.0 / 0.2.1 / 0.2.2 三次都在构建
# 中途被手动取消（取消时作业尚未走到上传步骤，所以已发布的资产不会被覆盖，但也意味着那次
# 运行没有任何产出）。需要让 CI 验一遍发行链时，手动 dispatch 本工作流即可；在 tag ref 上
# dispatch 仍会走到发布步骤（下方 `if`），在分支上 dispatch 则只构建、不发布。
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: 构建发行包并发布
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # P46：bun 负责依赖安装与脚本编排（bun.lock 冻结安装）；vite/vitest 仍由 Node 宿主
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
          components: clippy

      # 项目锁 MSVC；runner 自带 MSVC，显式覆盖确保链接。
      - name: 使用 MSVC 工具链
        run: rustup override set stable-x86_64-pc-windows-msvc

      - name: 安装依赖
        run: bun install --frozen-lockfile

      # 打包脚本自测（发行前）：三处版本一致性 + docs/说明书/ 全量收集契约。
      # 零新依赖：下一步 pack_release.py 本来就要 python。
      - name: 打包脚本自测（scripts/tests）
        run: bun run test:pack

      # 完整便携链：前端 build + tauri --no-bundle + pylon-detect + pack_release.py
      # 产物：release/pylon-<version>-win64.zip + .sha256 + .manifest.json
      - name: 打包发行包
        run: bun run release:portable

      - name: 发布到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/pylon-*-win64.zip
            release/pylon-*-win64.zip.sha256
            release/pylon-*-win64.manifest.json
          generate_release_notes: true