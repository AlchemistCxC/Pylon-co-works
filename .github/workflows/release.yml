name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: 构建发行包并发布
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # P46：bun 负责依赖安装与脚本编排（bun.lock 冻结安装）；vite/vitest 仍由 Node 宿主
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
          components: clippy

      # 项目锁 MSVC；runner 自带 MSVC，显式覆盖确保链接。
      - name: 使用 MSVC 工具链
        run: rustup override set stable-x86_64-pc-windows-msvc

      - name: 安装依赖
        run: bun install --frozen-lockfile

      # 完整便携链：前端 build + tauri --no-bundle + pylon-detect + pack_release.py
      # 产物：release/pylon-<version>-win64.zip + .sha256 + .manifest.json
      - name: 打包发行包
        run: bun run release:portable

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/pylon-*-win64.zip
            release/pylon-*-win64.zip.sha256
            release/pylon-*-win64.manifest.json
          generate_release_notes: true