name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: 前端（tsc + 测试 + build）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖（pnpm）
        run: pnpm install --frozen-lockfile

      # ISSUE-20 W1：统一入口——lint + vitest（含 legacy 套件，经 legacy-runner.test.mts）+ 覆盖率 + tsc/build
      - name: 统一前端门禁（check:frontend）
        run: npm run check:frontend

  rust:
    name: Rust（测试 + clippy + 构建）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # toolchain 显式指定：rust-toolchain.toml 的完整 toolchain 名会让 dtolnay
      # 解析失败（"target tuple in channel name"）；MSVC 为 CI runner 自带工具链。
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
          components: clippy

      # 项目 rust-toolchain.toml 锁定 MSVC，runner 自带 MSVC 工具链；
      # 本机（开发）未装 Windows SDK（rc.exe 缺失），CI 同样不依赖 SDK。
      - name: 使用 MSVC 工具链（CI runner 自带链接器）
        run: rustup override set stable-x86_64-pc-windows-msvc

      - name: 安装依赖（pnpm）
        run: pnpm install --frozen-lockfile

      # tauri::generate_context! 编译期要求 ../dist 存在（frontendDist），先构建前端
      - name: 前端构建（tauri generate_context 前置）
        run: npm run build

      # ISSUE-20 W1：同一 check:rust 入口（cargo test --lib + cargo build），不复制命令。
      # 集成组（b11_inject/obs03/p1_wire）依赖本地环境（spawn fake agent 子进程回环），
      # CI runner 上不可复现——跳过；本地 check:all 保持全量。
      - name: Rust 测试与构建（check:rust）
        run: cd src-tauri && cargo test --lib -- --skip b11_inject_integration_tests --skip obs03_evidence_tests --skip p1_wire_regression_tests && cargo build

      # ISSUE-20 W2：clippy 按项目 toolchain；不设 -D warnings（既有 33 条警告基线，独立清理）
      - name: clippy
        run: cd src-tauri && cargo clippy --lib

      # 必要 bundle（debug 二进制），不上传 secret/data
      - name: 上传 debug 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: pylon-debug-windows
          path: src-tauri/target/debug/pylon.exe