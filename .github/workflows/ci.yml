name: CI

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:

# #184：CI 侧裁剪 debug 信息（level 1 = line-tables-only）。Windows MSVC 的
# 全量 PDB 生成是链接大头；测试失败证据只需行号回溯，不需要全量变量信息。
# 仅环境变量注入、不改 Cargo.toml——本地开发行为不变。首次合入会因指纹
# 变化重编一次（rust-cache 按 lockfile+rustc 建 key，churn 一次性）。
env:
  CARGO_PROFILE_DEV_DEBUG: "1"

jobs:
  frontend:
    name: 前端静态门禁（lint + tsc + build）
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # P46：bun 负责依赖安装与脚本编排（bun.lock 冻结安装）；vite/vitest 仍由 Node 宿主
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # #106 P6：bun 安装缓存（与 rust job 合计省约 40s）。
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      # #193：vite/vitest transform 缓存——CI 每次 run 从零转译（实测累计
      # transform 80s+），按 bun.lock 建 key 跨 run 命中。
      - uses: actions/cache@v4
        with:
          path: node_modules/.vite
          key: vite-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: vite-${{ runner.os }}-

      - name: 安装依赖（bun）
        run: bun install --frozen-lockfile

      # ISSUE-20 W1 统一入口的静态半边：lint + IPC 契约（#106 P3b）+ tsc/build +
      # bundle/solid-smoke/docs/deps。
      # #193：vitest 拆到 frontend-test 分片矩阵（测试占前端 job 一半墙钟）；
      # check:frontend 本地语义保留（含测试），check:frontend:static 是其测试前缀。
      - name: 静态前端门禁（check:frontend:static）
        run: bun run check:frontend:static

      # #184：覆盖率门禁只在 main push 执行。阈值（vitest.config.ts）不挡 PR，
      # 但低于阈值的 PR 合入后 main 必红，仍闭环；PR 反馈环省 ~3 min。
      - name: 覆盖率门禁（main push 专用）
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: bun run test:coverage

      # #179：check:solid 上 CI——此前该门禁只在本地跑，main 曾带 A17 R2 违规
      # （sidebarModulePrefs.ts import plugin-runtime）合入而远端无感。
      - name: Solid 边界门禁（check:solid）
        run: bun run check:solid

  # #193：vitest 分片矩阵——606 文件 / 4439 用例对半分片并行，前端测试段
  # 墙钟减半。transform 缓存让两个分片共享转译结果。
  frontend-test:
    name: 前端测试（vitest 分片 ${{ matrix.shard }}/2）
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - uses: actions/cache@v4
        with:
          path: node_modules/.vite
          key: vite-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: vite-${{ runner.os }}-

      - name: 安装依赖（bun）
        run: bun install --frozen-lockfile

      # #193 修复：thirdPartySolidRenderer.integration 静态 import examples 插件的
      # dist 产物——旧单 job 里 build:example-plugin 在 check:frontend 链内先于
      # vitest 执行；拆分后必须在此显式前置，否则 CI 冷 checkout 缺 dist 报
      # import 解析失败（本地有历史构建产物所以不复现）。
      - name: 构建 example plugin（vitest 前置）
        run: bun run build:example-plugin

      # bun run 向脚本透传参数（vitest --shard 按 project 文件集合对半切）
      - name: vitest 分片运行
        run: bun run test --shard=${{ matrix.shard }}/2

  rust-test:
    name: Rust（fmt + 测试 + 构建）
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # P46：bun 负责依赖安装与脚本编排（bun.lock 冻结安装）；vite/vitest 仍由 Node 宿主
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # toolchain 显式指定：rust-toolchain.toml 的完整 toolchain 名会让 dtolnay
      # 解析失败（"target tuple in channel name"）；MSVC 为 CI runner 自带工具链。
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
          components: clippy

      # 项目 rust-toolchain.toml 锁定 MSVC，runner 自带 MSVC 工具链；
      # 本机（开发）未装 Windows SDK（rc.exe 缺失），CI 同样不依赖 SDK。
      - name: 使用 MSVC 工具链（CI runner 自带链接器）
        run: rustup override set stable-x86_64-pc-windows-msvc

      # #184：Windows runner 的 Defender 实时扫描对 target 目录的指纹校验与
      # 编译 I/O 征重税（shadow parity 实测：测试本体 0.2s，单次 cargo 调用
      # 进程开销 80-135s）。对 ephemeral runner 排除编译目录是常规提速手段，
      # 只作用于本次运行的隔离环境。
      - name: Defender 排除编译目录（target / cargo home）
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}\src-tauri\target"
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.cargo"

      # #184：fmt 前置 fail-fast——3s 出结果，失败不必等缓存恢复/安装/全量测试。
      # 此前 fmt 排在测试与 shadow 之后，3 次 fmt 失败各白等约 10 分钟。
      - name: fmt（workspace --all --check，fail-fast）
        run: cargo fmt --all --manifest-path src-tauri/Cargo.toml --check

      # #106 P6：workspace 单 target 目录整树缓存——依赖冷编译是 rust job 最大
      # 痛点（check:rust 406s 基线），clippy 指纹产物随 target 跨 run 命中。
      # #184：rust-cache 会在每个分支各存一份副本导致 10GB 配额爆满互相驱逐；
      # 分支副本由 cache-cleanup.yml 每日清理（非 main ref 且 2 天未访问），
      # main 的热缓存常驻供所有 PR 按 key 恢复。
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri

      - name: 安装依赖（bun）
        run: bun install --frozen-lockfile

      # tauri::generate_context! 编译期要求 ../dist 存在（frontendDist），先构建前端
      - name: 前端构建（tauri generate_context 前置）
        run: bun run build

      # ISSUE-20 W1：同一命令形态，不复制语义（fmt 在上方 fail-fast，clippy 见
      # rust-clippy job）。
      # #106 P0 workspace 化：--workspace 关闭子 crate 测试黑洞（pylon-core /
      # foundations / pet-core 的内嵌测试首次进 CI）。
      # #106 P1：b11/obs03/p1_wire 等集成形态测试解除 skip 进 CI（历史 skip 系
      # locale 不可复现 + 本地 Python 依赖）；假 agent = pylon-fake-agent bin，
      # 先构建再跑测试——测试进程经 current_exe 祖先目录定位该 bin。
      # #184：本 job 拆自原单 rust job；shadow parity / clippy 并行见独立 job。
      - name: Rust 测试与构建
        run: |
          cd src-tauri
          cargo build --bin pylon-fake-agent --features test-agent
          cargo test --workspace --lib --features test-agent
          cargo test --workspace --tests --features test-agent
          cargo build

      # 必要 bundle（debug 二进制），不上传 secret/data。
      # #184：收敛到 main push——分支 run 的 debug 产物少有人取，省每次 12s
      # 与 artifact 存储 churn。
      - name: 上传 debug 构建产物
        uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: pylon-debug-windows
          path: src-tauri/target/debug/pylon.exe
          if-no-files-found: warn

      # #106 P7.1：失败证据包——测试挂掉时 harness 证据（journal/事件导出、
      # wire snapshot、测试 stderr、temp 清单）打包为可下载 artifact，debug
      # 无需本地复现。与 P2 证据收集器同一数据面；成功 run 不产生该 artifact。
      - name: 失败证据包（CI evidence bundle）
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/ci-evidence
          # 测试进程的临时目录残留（harness TempPath 正常不残留；崩溃残留即证据）
          find "${TEMP:-/tmp}" -maxdepth 1 -name 'pylon-*' -newer src-tauri/Cargo.toml \
            -print > artifacts/ci-evidence/temp-residue.txt 2>/dev/null || true
          # 本地门禁输出（fmt/测试的可见错误摘要）
          cargo check --manifest-path src-tauri/Cargo.toml --workspace --all-targets \
            > artifacts/ci-evidence/cargo-check.txt 2>&1 || true

      - name: 上传失败证据包
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ci-evidence
          path: artifacts/ci-evidence/**
          retention-days: 14
          if-no-files-found: warn

  rust-clippy:
    name: Rust（clippy 基线门禁）
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
          components: clippy

      - name: 使用 MSVC 工具链（CI runner 自带链接器）
        run: rustup override set stable-x86_64-pc-windows-msvc

      - name: Defender 排除编译目录（target / cargo home）
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}\src-tauri\target"
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.cargo"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri

      - name: 安装依赖（bun）
        run: bun install --frozen-lockfile

      # clippy 展开宏时 generate_context! 同样要求 ../dist 存在，先构建前端
      - name: 前端构建（tauri generate_context 前置）
        run: bun run build

      # ISSUE-20 W2 + P66：clippy 不设 -D warnings——门禁语义是「相对
      # artifacts/clippy-baseline.json 零新增」（scripts/check-clippy-baseline.mjs，
      # 指纹带 crate 限定 + 处数计数）。
      # #106 P0 workspace 化：单次 `cargo clippy --workspace` 替代 4 次
      # --manifest-path 全量重编（共享依赖只编译一次）；workspace 成员都是主 crate，
      # 无 path 依赖 cap-lints 静默问题（历史 `-p` lint 静默系无 workspace 时的症状）。
      # 一份 json 按包过滤（--package）后逐 crate 对基线：基线语义与之前逐 crate 相同。
      # 不 cd：clippy 诊断文件路径相对 workspace 根（src-tauri）生成，脚本按仓库根解析，
      # --crate-dir 统一给 src-tauri。
      # #184：clippy 拆为独立并行 job——check 模式产物与测试构建指纹互不共享，
      # 串行等于两次全量编译排队。
      - name: clippy（workspace + 基线门禁）
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --manifest-path src-tauri/Cargo.toml --workspace --all-targets --message-format=json > artifacts/clippy-workspace.json 2> artifacts/clippy-workspace.err
          failed=0
          for spec in "pylon" "pylon-core" "pylon-foundations" "pet-core"; do
            node scripts/check-clippy-baseline.mjs artifacts/clippy-workspace.json artifacts/clippy-baseline.json --crate="$spec" --crate-dir=src-tauri --package="$spec" || failed=1
          done
          exit $failed

      - name: clippy 失败证据包
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/ci-evidence
          cp -f artifacts/clippy-workspace.err artifacts/ci-evidence/ 2>/dev/null || true
          cp -f artifacts/clippy-workspace.json artifacts/ci-evidence/ 2>/dev/null || true

      - name: 上传 clippy 失败证据包
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ci-evidence-clippy
          path: artifacts/ci-evidence/**
          retention-days: 14
          if-no-files-found: warn

  rust-shadow:
    name: Rust（ACP shadow parity）
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: 使用 MSVC 工具链（CI runner 自带链接器）
        run: rustup override set stable-x86_64-pc-windows-msvc

      - name: Defender 排除编译目录（target / cargo home）
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}\src-tauri\target"
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.cargo"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri

      - name: 安装依赖（bun）
        run: bun install --frozen-lockfile

      # generate_context! 要求 ../dist 存在（shadow 脚本内的 cargo 调用同样展开该宏）
      - name: 前端构建（tauri generate_context 前置）
        run: bun run build

      # #106 P1：假 agent 先构建再跑 fixture——测试进程经 current_exe 祖先目录定位该 bin。
      # #184：shadow 拆为独立并行 job——旧单 job 里它排在测试之后串行（9.2 min，
      # 其中 fixture 测试本体仅 0.2s，其余是 feature 错配重编 + cargo 进程开销）。
      - name: 构建 fake agent
        run: cd src-tauri && cargo build --bin pylon-fake-agent --features test-agent

      # A9 shadow parity：两次隔离的 SDK fixture 运行比对 wire/canonical/projection/终态/背压。
      - name: ACP shadow parity（check:acp-shadow）
        run: bun run check:acp-shadow
