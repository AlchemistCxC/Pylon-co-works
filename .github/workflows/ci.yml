name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: 前端（tsc + 测试 + build）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # P46：bun 负责依赖安装与脚本编排（bun.lock 冻结安装）；vite/vitest 仍由 Node 宿主
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装依赖（bun）
        run: bun install --frozen-lockfile

      # ISSUE-20 W1：统一入口——lint + vitest（含 legacy 套件，经 legacy-runner.test.mts）+ 覆盖率 + tsc/build
      - name: 统一前端门禁（check:frontend）
        run: bun run check:frontend

  rust:
    name: Rust（测试 + clippy + 构建）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # P46：bun 负责依赖安装与脚本编排（bun.lock 冻结安装）；vite/vitest 仍由 Node 宿主
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # toolchain 显式指定：rust-toolchain.toml 的完整 toolchain 名会让 dtolnay
      # 解析失败（"target tuple in channel name"）；MSVC 为 CI runner 自带工具链。
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
          components: clippy

      # 项目 rust-toolchain.toml 锁定 MSVC，runner 自带 MSVC 工具链；
      # 本机（开发）未装 Windows SDK（rc.exe 缺失），CI 同样不依赖 SDK。
      - name: 使用 MSVC 工具链（CI runner 自带链接器）
        run: rustup override set stable-x86_64-pc-windows-msvc

      - name: 安装依赖（bun）
        run: bun install --frozen-lockfile

      # tauri::generate_context! 编译期要求 ../dist 存在（frontendDist），先构建前端
      - name: 前端构建（tauri generate_context 前置）
        run: bun run build

      # ISSUE-20 W1：同一 check:rust 入口（cargo test --lib + cargo build），不复制命令。
      # 集成组（b11_inject/obs03/p1_wire）依赖本地环境（spawn fake agent 子进程回环），
      # CI runner 上不可复现——跳过；本地 check:all 保持全量。
      - name: Rust 测试与构建（check:rust）
        run: cd src-tauri && cargo test --lib -- --skip b11_inject_integration_tests --skip obs03_evidence_tests --skip p1_wire_regression_tests && cargo build

      # A9 shadow parity：两次隔离的 SDK fixture 运行比对 wire/canonical/projection/终态/背压。
      # 依赖刚构建的 test 二进制与 spawn fake agent 回环，故放在 Rust job（不是前端 job）。
      - name: ACP shadow parity（check:acp-shadow）
        run: bun run check:acp-shadow

      # ISSUE-20 W2 + P66：clippy 按项目 toolchain，仍不设 -D warnings——门禁语义是
      # 「相对 artifacts/clippy-baseline.json 零新增」（scripts/check-clippy-baseline.mjs，
      # 指纹带 crate 限定 + 处数计数）。
      # 四个 crate 必须分别以 --manifest-path 起跑：从 src-tauri 跑 `cargo clippy -p pylon-core`
      # 会把 path 依赖当依赖编译，lint 静默不上报（实测 0 警告），子 crate 将完全脱离门禁。
      # 不 cd：cargo 的诊断文件路径始终相对**各包根**生成，而脚本按**仓库根**解析 json
      # 参数，所以全用仓库根相对路径，两边基准才一致。
      - name: clippy（4 crate + 基线门禁）
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          run_crate() {
            cargo clippy --manifest-path "$1" --all-targets --message-format=json > "artifacts/clippy-$2.json" 2> "artifacts/clippy-$2.err"
            node scripts/check-clippy-baseline.mjs "artifacts/clippy-$2.json" artifacts/clippy-baseline.json --crate="$2" --crate-dir="$3" || failed=1
          }
          run_crate src-tauri/Cargo.toml pylon src-tauri
          run_crate src-tauri/pylon-core/Cargo.toml pylon-core src-tauri/pylon-core
          run_crate src-tauri/pylon-foundations/Cargo.toml pylon-foundations src-tauri/pylon-foundations
          run_crate src-tauri/pet-core/Cargo.toml pet-core src-tauri/pet-core
          exit $failed

      # 必要 bundle（debug 二进制），不上传 secret/data
      - name: 上传 debug 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: pylon-debug-windows
          path: src-tauri/target/debug/pylon.exe