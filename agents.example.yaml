# Pylon agent 配置（战役 2 后：协议差异全部配置化，覆盖制——无声明=默认值，有声明=覆盖默认）
#
# hermes_profile: <profile-name | profile-path>   # Hermes profile 固定（release-issues #1 方案 G）
#   # 值为 profile 名称（如 `my-profile`，经 Hermes 根目录自动解析为 <home>/profiles/<name>）
#   # 或 profile 目录路径（绝对路径原样使用；相对路径按本配置文件所在目录解析）。
#   # 设置后启动 Hermes ACP 子进程时注入 HERMES_HOME=<profile 目录>，确保 Hermes 使用
#   # 该 profile 的 provider/密钥——不设置时 Hermes 走 active_profile 机制（当前机器
#   # active_profile 的 provider 可能无效，导致“有余额但 401/无回应”）。
#   # 缺省不注入（现状行为）。可用 profile 列表由 Pylon 启动时自动探测
#   # （%LOCALAPPDATA%\hermes / HERMES_HOME / PATH 中 hermes 脚本），见 startup diagnostics。
#
# acp: 段（AcpProtocolConfig，全字段可选）：
#   set_model_api: config_option | set_model | none | true | false
#       # 切 model 途径（D2）。config_option=Peri 官方路径（默认）；set_model=Hermes
#       # unstable session/set_model；none=禁用切 model；true/false 为 legacy 布尔
#       # 兼容形态（true=set_model，false=config_option）。顶层 set_model_api: true
#       # 为 legacy 写法，等价于 acp.set_model_api: set_model。
#   session_close: true | false
#       # D3。true=总是尝试 session/close RPC + -32601 防御降级（默认）；
#       # false=跳过 RPC 直接本地清理（旧版 Hermes 无此方法时用）。
#   mcp_servers: always | omit_if_empty
#       # D4。always=恒发 mcpServers 字段（默认，现状 wire）；omit_if_empty=空配置
#       # 时省略字段（协议 v2 语义——仅当 agent 容忍缺字段时使用，Hermes Pydantic
#       # 必填会拒绝）。
#   initialize_caps: {...}     # D1 clientCapabilities 覆盖（默认：tokenStats +
#                               # _meta.peri.*，Hermes 忽略无害）
#   protocol_version: 1        # H3 initialize 协议版本（默认 1）
#   client_info: {...}         # H4 initialize clientInfo（默认 {"name":"Pylon","version":"0.1.0"}）
#   prompt_timeout_secs: 300   # H5 单步闲置超时（默认 300，不限制整轮回合）
#   idle_timeout_secs: 300     # R-t5 活动后的闲置窗口；Hermes/Windows 未声明时跟随
#                              # prompt_timeout_secs，避免长思考期间被短窗口误掐断
#   first_token_timeout_secs: 300 # R-t5 首 token 窗口；Hermes/Windows 保留 prompt 超时预算
#   cancel_settle_timeout_secs: 30  # H6 cancel 后等待 settle；Hermes/Windows 未声明时 5s
#   rpc_timeout_secs: 30       # H8/H9 通用 RPC 超时（默认 30）
#   max_attachments: 8         # H10 附件数上限（默认 8）
#   max_attachment_bytes: 10485760  # H11 单附件上限（默认 10MB）
#   replay_max_events: 10000   # H12 session/load 回放收集上限（默认 10000）

agents:
  # provider: 协议/实现类别（如 peri/hermes）。旧配置缺省时后端按协议依据推断：
  # hermes_profile 存在 → hermes；exe 文件名（去扩展名小写）命中 peri/hermes → 对应
  # provider；无信号保持缺省（前端显式降级 invalid-instance，不按 agentId 名称猜）。
  peri:
    name: Peri
    provider: peri
    transport: subprocess
    exe: <PERI_EXE_PATH>
    args: ["acp"]
    model: deepseek-v4-flash
    default: true
    # acp: 段缺省 = 官方 schema 行为（config_option 切 model / close 总是尝试 /
    # mcpServers 恒发 / protocolVersion 1 / 超时 300-30-30-10s）——无需声明。
  hermes:
    name: Hermes
    provider: hermes
    transport: subprocess
    exe: hermes
    args: ["acp"]
    set_model_api: true
    # 固定到可用 profile（deepseek provider + opencode.ai base_url）；当前机器
    # active_profile 的 provider 可能无效会导致 401。换机器时改为该机可用 profile 名。
    # 用绝对路径（非纯名称）：避免 Pylon 进程继承的 HERMES_HOME 环境变量
    # （Hermes 启动器设的 profile 目录）污染 detect_hermes_home → 嵌套 profiles\<name>。
    hermes_profile: <HERMES_PROFILE_PATH>
    # Windows 下 Hermes 未显式声明 idle_timeout_secs 时，Pylon 兼容层跟随这里的
    # prompt_timeout_secs 作为“无活动”预算（工具/思考/文本活动会续命），避免
    # 长思考被固定短窗口误截；如需更短闲置窗口，可显式设置
    # acp.idle_timeout_secs / first_token_timeout_secs 覆盖。
    acp:
      prompt_timeout_secs: 180
    # 可选：覆盖 Hermes 内部并发工具批次的秒级兜底（默认 30；0/负数表示禁用，
    # 由 Hermes 自己解释）。该环境变量只注入 Hermes 子进程，不影响其他 Agent。
    # env:
    #   HERMES_CONCURRENT_TOOL_TIMEOUT_S: "30"
    # legacy 顶层布尔（= acp.set_model_api: set_model）。显式化等价写法：
    # acp:
    #   set_model_api: set_model        # Hermes 切 model 走 unstable session/set_model
    #   session_close: false            # 旧版 Hermes 无 session/close——跳过 RPC 本地清理

# 工具归一化字典（provider → tools）：后端 list_tool_dictionary 下发，前端注册到 toolRegistry。
# 语义：name=wire 工具名；aliases=等价别名；kind=归一化分类；action=渲染动作；
#       summary_fields=参数摘要提取字段（按顺序取第一个命中）；output_label=输出行标签。
tool_dictionary:
  peri:
    - name: Read
      display_name: Read
      aliases: [read, reading]
      kind: read
      action: read
      summary_fields: [file_path]
      output_label: lines
    - name: Write
      display_name: Write
      aliases: [write]
      kind: edit
      action: write
      summary_fields: [file_path]
      output_label: changed-lines
    - name: Edit
      display_name: Edit
      aliases: [edit]
      kind: edit
      action: edit
      summary_fields: [file_path]
      output_label: changed-lines
    - name: Glob
      display_name: Glob
      aliases: [glob]
      kind: search
      action: search
      summary_fields: [pattern]
      output_label: matches
    - name: Grep
      display_name: Grep
      aliases: [grep]
      kind: search
      action: search
      summary_fields: [pattern]
      output_label: matches
    - name: folder_operations
      display_name: Folder Operations
      aliases: []
      kind: edit
      action: edit
      summary_fields: [folder_path]
      output_label: lines
    - name: Bash
      display_name: Bash
      aliases: [Shell, shell]
      kind: execute
      action: execute
      summary_fields: [command]
      output_label: lines
    - name: WebFetch
