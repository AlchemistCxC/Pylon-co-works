# #106 P6：Rust 构建/测试提速（实测驱动）。
#
# 1. rust-lld 链接器（target 级配置，不分 profile）：Windows 上链接常见 2-5×
#    提速，治「touch lib.rs 重编译+链接 21.5s」的内环税。release 构建在本 PR
#    内验证 bundle 产物正常；异常则在 release 工作流以环境变量回退 MSVC link.exe。
# 2. debug = "line-tables-only"：砍 MSVC PDB 生成（链接大头），保回溯 file:line。
#    仅减调试信息密度，零行为影响。
#
# 位置约定（#399）：本文件必须留在**仓库根**的 `.cargo/`。cargo 的配置发现是从 cwd
# 逐级向上走，`--manifest-path` 不会把 manifest 所在目录的 `.cargo/config.toml` 带进来
# ——此前它在 `src-tauri/.cargo/`，于是「cd src-tauri && cargo …」与「cargo
# --manifest-path src-tauri/Cargo.toml …」是两套 rustc flag 集（rust-lld vs link.exe），
# 写同一批产物路径而互相作废，来回切一次就整图重编一次（CI `check:acp-shadow` 一步
# 实测 784s，其中测试本体仅 0.3s）。放这里后任何 cwd（仓库根 / src-tauri / 子 crate /
# tools 下的独立 workspace）都命中同一份配置。
#
# 口径约定（#401）：
# 1. `[profile.dev] debug` 以本文件为**唯一真源**——CI 曾用 workflow 级 env
#    `CARGO_PROFILE_DEV_DEBUG=1` 覆盖它，而 `1` 与 `line-tables-only` 是两个不同的
#    rustc flag 串（`-C debuginfo=1` vs `-C debuginfo=line-tables-only`），翻转即整图
#    重编（9-crate 图像实测 9/9），CI 与本地产物因此互相作废。该 env 已删。
# 2. `CARGO_INCREMENTAL` 不在本文件里定：CI 由 rust-cache 恒置 0、本地默认开。
#    它只进**本地 unit** 的指纹——同一个 target 上反复切会各付一次该 unit 的重编与
#    重链（真实 workspace 实测 1 个 unit、42–67s）。别在同一个 target 上混用两种口径。

[target.x86_64-pc-windows-msvc]
linker = "rust-lld"

[profile.dev]
debug = "line-tables-only"
