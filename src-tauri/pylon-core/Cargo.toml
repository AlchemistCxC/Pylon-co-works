[package]
name = "pylon-core"
version = "1.0.0"
edition = "2021"
description = "Pylon standalone library — agent catalog/detection and CLI client (no Tauri/GUI dependencies)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0.13"
tokio = { version = "1", features = ["process", "time", "rt", "net", "sync", "io-util", "macros"] }
futures-util = "0.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading"] }
