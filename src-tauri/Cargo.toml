[package]
name = "pylon"
version = "0.1.0"
edition = "2021"
description = "Prism Desktop - AI Agent GUI"

[package.metadata]
authors = ["宫木云"]

[package.metadata.tauri-winres]
FileDescription = "Prism Desktop"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
pylon-pet-core = { path = "pet-core" }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
serde_yaml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"
rand = "0.10"
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake", "rustls-tls-native-roots"] }
tokio-rustls = "0.26"
rustls = "0.23"
rustls-native-certs = "0.8"
futures-util = "0.3"
infer = "0.19"
url = "2"
log = "0.4"
# R2 错误类型化：PylonError Display/Error 由 derive 生成（DTO 序列化仍手写）
thiserror = "2"
# 官方 ACP schema（v1 + v2 类型全集）——消除手写协议参数构造
agent-client-protocol-schema = "1.4"
dashmap = "6.2.1"
encoding_rs = "0.8.35"
regex = "1.13.1"
backon = "1.6.0"
tokio-util = { version = "0.7.19", features = ["rt"] }
ringbuffer = "0.16.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
serde_yml = "0.0.13"
chrono = "0.4.45"

[build-dependencies]
tauri-build = { version = "2", features = [] }
embed-resource = "3"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

[lib]
name = "prism_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]
