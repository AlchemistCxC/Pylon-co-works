[package]
name = "pylon"
version = "0.1.0"
edition = "2021"
description = "Prism Desktop - AI Agent GUI"

[package.metadata]
authors = ["宫木云"]

[package.metadata.tauri-winres]
FileDescription = "Prism Desktop"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
pylon-pet-core = { path = "pet-core" }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
serde_yaml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"
infer = "0.19"
url = "2"
log = "0.4"

[build-dependencies]
tauri-build = { version = "2", features = [] }
embed-resource = "3"

[lib]
name = "prism_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]
