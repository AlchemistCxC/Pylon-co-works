[package]
name = "pylon-acp"
version = "0.2.6-Abc"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "time", "rt", "sync", "io-util", "macros"] }
futures-util = "0.3"
thiserror = "2"
base64 = "0.23"
tokio-util = { version = "0.7", features = ["compat"] }
agent-client-protocol-schema = "1.7"
regex = "1"
ringbuffer = "0.16"
infer = "0.22"
tracing = "0.1"
agent-client-protocol = "2.1.0"
pylon-core = { path = "../pylon-core" }
pylon-foundations = { path = "../pylon-foundations" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Storage_FileSystem"] }
