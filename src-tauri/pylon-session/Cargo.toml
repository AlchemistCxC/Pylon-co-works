[package]
name = "pylon-session"
version = "0.2.7-MAT"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.11"
tracing = "0.1"
chrono = "0.4"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time"] }
rusqlite = { version = "0.40", default-features = false, features = ["bundled", "cache"] }
pylon-canonical-types = { path = "../pylon-canonical-types" }
pylon-foundations = { path = "../pylon-foundations" }
