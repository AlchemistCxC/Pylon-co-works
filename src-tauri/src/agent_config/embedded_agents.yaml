# Pylon Agent 配置 —— 内嵌兜底样例（编译期 include_str 嵌入，见 agent_config/load.rs）
#
# 生效条件：既没有 PYLON_AGENTS_CONFIG，exe 同目录也没有 agents.yaml。
# 本样例**不注册任何 Agent**，因此首次启动是干净空态，由
# 设置 → Agent 的分步引导（探测本机 → 选 exe → 测试连接 → 创建）建立第一个 Agent。
#
# 为什么不再预置 Agent：占位 exe（如 <PERI_EXE_PATH>）必然启动失败，首屏会变成
# 「两个必然失败的 Agent」而不是引导，与发行说明的口径也相互矛盾（#326）。
#
# 要预置 Agent，请在 exe 同目录（或 PYLON_AGENTS_CONFIG 指向的位置）放置 agents.yaml
# （#372 起发行包已自带零 Agent 的 agents.yaml，直接编辑即可；模板源
# resources/release/agents.template.yaml），字段说明见 docs/说明书/Pylon-项目架构参考.md。
#
# `agents` 键必须存在：缺键按配置错误报出（避免把拼错的键名静默当成「零 Agent」），
# 而显式的空映射是合法的「零 Agent」状态。
agents: {}

# 可选：外置工具归一化字典（provider → tools）。缺省为空表，前端继续用内置 fallback。
# tool_dictionary: {}
