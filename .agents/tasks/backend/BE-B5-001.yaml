version: 1
id: BE-B5-001
title: 实现固定 Git runner 与只读 status
lane: backend
priority: P1
stage: git-read
subsystem: git
size: L
relay_group: git-read
blocks_other_lane: true
domains: [git-backend, tauri-command]
dependencies: {tasks: [BE-B2-001], checkpoints: []}
goal:
  user_result: 前端能读取当前 Session 工作区的 branch 和 staged/unstaged/untracked/conflict 状态。
  technical_result: 固定参数 Git runner + porcelain v2 -z parser，不提供通用 shell/Git 代理。
source_facts:
  - 当前后端没有 Git 模块。
  - Workspace root 必须从 source→SessionInfo.cwd 解析。
scope:
  inspect_first:
    - src-tauri/src/lib.rs 中 SessionInfo cwd/root 解析
    - src-tauri/src/workspace.rs containment 模式
    - docs/后端开发与交接手册.md B5
  likely_modify:
    - src-tauri/src/git.rs
    - src-tauri/src/lib.rs
    - src-tauri/Cargo.toml（仅确有必要）
    - 对应 Rust tests/fixture
    - docs/后端开发与交接手册.md
  do_not_modify: [src/**, Git 写操作, 通用 shell]
guidance:
  invariants:
    - 参数数组固定，禁 prompt/pager/editor。
    - GIT_OPTIONAL_LOCKS=0。
    - timeout、输出上限、kill/wait。
    - root 由 source 解析。
  non_goals: [diff, history, stage, discard, commit, push]
verification:
  during_development:
    - cd src-tauri && cargo check
    - 临时 repo focused status tests
  checkpoint_only: [真实 Tauri 临时 repo]
completion:
  - status command 和 parser 可用
  - 非 repo/冲突/detached 有稳定结果
opens_checkpoint: null
