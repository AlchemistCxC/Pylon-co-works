version: 1
id: BE-B0-001
title: 冻结 Agent list/status 身份契约
lane: backend
priority: P0
stage: foundation
subsystem: agent-registry
size: M
relay_group: backend-runtime-foundation
domains: [agent-runtime, tauri-command]
dependencies: {tasks: [], checkpoints: []}
blocks_other_lane: true
goal:
  user_result: Agent 列表、状态点和切换 UI 能稳定按 registry ID 识别 Agent，不再把显示名称当 key。
  technical_result: 冻结 list_agents、agent_status、peri:agent-status 的字段、状态枚举和兼容策略。
source_facts:
  - 当前后端已加入 agentId/agentName，但兼容字段 agent 仍是 display name。
  - 当前前端 normalizeAgentStatus 主要读取 agent，并用它作为 agentStatuses key。
  - Prism 配置错误降级源码已存在，不应在本任务重复实现。
scope:
  inspect_first:
    - src-tauri/src/lib.rs::agent_status_payload
    - src-tauri/src/lib.rs::agent_summary_payload
    - src-tauri/src/lib.rs::list_agents
    - src-tauri/src/lib.rs 中 peri:agent-status emit
    - src-tauri/src/agent_runtime.rs 的 lifecycle status
    - .agents/contracts/agent-status.md
    - docs/后端开发与交接手册.md 的 B0 小节
  likely_modify:
    - src-tauri/src/lib.rs
    - src-tauri/src/agent_runtime.rs
    - .agents/contracts/agent-status.md
    - docs/后端开发与交接手册.md
  do_not_modify:
    - src/**
    - src-tauri/src/acp.rs
    - src-tauri/src/prism.rs
    - agents.yaml
guidance:
  invariants:
    - agentId 始终是 registry key，agentName 只用于展示。
    - 不返回 args/env secret。
    - active、available、status 的语义必须一致且可由前端兼容消费。
    - 兼容字段如果保留，必须明确 deprecated 含义。
  non_goals:
    - Agent registry create/update/delete
    - 多 Agent runtime
    - 前端 adapter
    - 全量结构化 PylonError
verification:
  during_development:
    - cd src-tauri && cargo test --lib agent -- --nocapture
    - cd src-tauri && cargo check
  checkpoint_only:
    - 真实 Tauri list/status/event
completion:
  - contract 标为 frozen
  - focused tests 或 cargo check 通过
  - 后端手册只更新 B0 对应事实
opens_checkpoint: null
