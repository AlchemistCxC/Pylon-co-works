  invariants:
    - secret 可进 wire，不进日志/诊断/文档。
    - 未实现持久化时必须明确 runtime-only。
    - owner 不明确时先冻结产品契约再编码。
  non_goals: [前端 MCP UI, 全局 Prompt 伪字段]
