version: 1
id: BE-B3-001
title: 完成 Prism route audit 并冻结只读契约
lane: backend
priority: P0
stage: prism-read
subsystem: prism
size: L
relay_group: prism
blocks_other_lane: true
domains: [prism-transport, tauri-command]
dependencies: {tasks: [BE-B0-001], checkpoints: []}
goal:
  user_result: 前端可以基于真实 Prism route 开始接入 health/state/scenario/source/block 只读数据。
  technical_result: 对照 G:\Project\prism 当前 route/handler，修正或删除伪 command，并冻结只读 command/DTO/error 状态。
source_facts:
  - Prism 当前若干 delete route 是 POST + query。
  - Pylon 已有 PrismClient 和大量 command，但 command 存在不等于 route 已验收。
  - 前端 PrismSheet 仍是静态演示，不得提前消费 proposed CRUD。
scope:
  inspect_first:
    - src-tauri/src/prism.rs
    - src-tauri/src/lib.rs 中 prism_* command 与 generate_handler
    - G:\Project\prism\src\main.rs route 表
    - G:\Project\prism 中对应只读 handler
    - .agents/contracts/prism.md
    - docs/后端开发与交接手册.md 的 B3
  likely_modify:
    - src-tauri/src/prism.rs
    - src-tauri/src/lib.rs
    - 对应 Rust transport tests
    - .agents/contracts/prism.md
    - docs/后端开发与交接手册.md
  do_not_modify:
    - src/**
    - G:\Project\prism
    - 生产 G:\Prism 数据
guidance:
  invariants:
    - 只允许固定 loopback 和固定 endpoint。
    - 不暴露通用 URL/method 代理。
    - route method/path/query/body 以 Prism 当前源码为准。
    - read contract 与 write contract 分开冻结。
  non_goals:
    - 前端 Prism UI
    - 生产数据 CRUD
    - 全量写链真实验收
verification:
  during_development:
    - cd src-tauri && cargo test --lib prism -- --nocapture
    - cd src-tauri && cargo check
  checkpoint_only:
    - 真实 Tauri invoke
    - 临时 Prism data root 读链
completion:
  - route audit 有源码依据
  - 伪 command 已删除或标记 unavailable
  - 只读 contract 标为 frozen
opens_checkpoint: null
