version: 1
id: FE-F1-002
title: 收敛 Workspace transport 与 preview 单一真值
lane: frontend
priority: P1
stage: right-panel
subsystem: right-panel-workspace
size: M
relay_group: right-panel-workspace
blocks_other_lane: false
domains: [right-panel, workspace-sheet, react]
dependencies: {tasks: [FE-F1-001], checkpoints: []}
goal:
  user_result: 用户可以展开至少三级目录并读取深层文件，切换 Session 后旧响应不会污染新预览。
  technical_result: transport 集中到 adapter，selectedText 只有 WorkspaceViewState 一个 owner，递归 handler 完整透传。
source_facts:
  - RightPanel.tsx 当前直接 invoke Workspace commands。
  - WorkspaceViewState 已有 selectedText，但组件另有 textPreview state。
  - WorkspaceTreeNode 递归只透传 onSelect。
scope:
  inspect_first:
    - src/components/RightPanel.tsx
    - src/components/right-panel/rightPanelTypes.ts
    - src/components/right-panel/workspaceApi.ts
    - src/components/right-panel/WorkspacePanel.tsx
    - src/components/right-panel/WorkspacePanel.css
    - scripts/test-right-panel-workspace*.mts
    - scripts/test-workspace-*.mts
  likely_modify:
    - 上述生产文件、CSS 和 targeted tests
    - docs/前端开发与交接手册.md F1.3
  do_not_modify: [src/store.ts, src/App.tsx, src-tauri/**, File Sheet]
guidance:
  invariants:
    - selectedText 只存在于 WorkspaceViewState。
    - Session/source 变化使旧 response 失效。
    - 递归节点透传 onExpand/onRead。
    - invoke transport 不散落回组件。
  non_goals: [Workspace 后端分页, File Sheet, Runtime Sheet, 视觉重写]
verification:
  during_development:
    - node --experimental-strip-types scripts/test-right-panel-workspace.mts
    - node --experimental-strip-types scripts/test-right-panel-workspace-expand-read.mts
    - node --experimental-strip-types scripts/test-workspace-api-normalization.mts
    - npm run build
  checkpoint_only: [npm run test:frontend, 真实 Tauri 深层目录]
completion:
  - 双 preview state 消失
  - 深层递归 handler 可用
  - stale response 有 targeted coverage
opens_checkpoint: CP-FRONTEND-SHELL
