version: 1
id: FE-F0-008
title: Workspace 管理菜单与 pinned 状态闭环
lane: frontend
priority: P0
stage: workspace-shell
subsystem: workspace-sheet
size: M
relay_group: workspace-shell
blocks_other_lane: false
domains: [workspace-sheet, react]
dependencies: {tasks: [], checkpoints: []}
goal:
  user_result: 用户可以固定/取消固定 Sheet，并安全关闭当前、其他和右侧 Sheet。
  technical_result: pinned 语义统一进入 Sheet reducer/persistence，菜单和 Tab 复用同一 action。
source_facts:
  - SheetRecord 已有 pinned 字段。
  - Tab 已阻止键盘/按钮直接关闭 pinned。
  - reducer 的 close/closeOthers/closeRight 尚未统一保护 pinned，也没有 pin action。
scope:
  inspect_first:
    - src/workspace-sheets/sheetTypes.ts
    - src/workspace-sheets/sheetState.ts
    - src/workspace-sheets/sheetPersistence.ts
    - src/workspace-sheets/SheetTabStrip.tsx
    - src/workspace-sheets/WorkspaceTitlebar.tsx
    - src/App.tsx 中 titlebar action 接线范围
    - scripts/test-sheet-state.mts
    - scripts/test-sheet-persistence.mts
  likely_modify:
    - src/workspace-sheets/sheetTypes.ts
    - src/workspace-sheets/sheetState.ts
    - src/workspace-sheets/sheetPersistence.ts
    - src/workspace-sheets/WorkspaceMenu.tsx
    - src/workspace-sheets/SheetTabStrip.tsx
    - src/workspace-sheets/WorkspaceTitlebar.tsx
    - src/store.ts 的 Sheet actions 局部
    - src/App.tsx 的菜单接线局部
    - src/App.css
    - scripts/test-sheet-state.mts
    - scripts/test-sheet-persistence.mts
    - docs/前端开发与交接手册.md F0.8
  do_not_modify:
    - src-tauri/**
    - src/components/chat/**
    - Agent switch 事务
guidance:
  invariants:
    - pinned Sheet 不被普通 close/closeOthers/closeRight 删除。
    - pin 状态进入现有 versioned persistence。
    - Tab 右键菜单和顶栏 Workspace 菜单复用同一 actions。
    - 保持现有顶栏视觉。
  non_goals: [拖拽排序, 多窗口, 复制 Sheet, Agent switch]
verification:
  during_development:
    - node --experimental-strip-types scripts/test-sheet-state.mts
    - node --experimental-strip-types scripts/test-sheet-persistence.mts
    - npm run build
  checkpoint_only:
    - npm run test:frontend
    - 浏览器菜单/右键/键盘
completion:
  - pin/unpin 和关闭语义有 targeted tests
  - persistence round-trip 保留 pinned
  - build 通过
opens_checkpoint: null
